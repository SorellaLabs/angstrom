name: Check Rust
on:
  pull_request:

# Stop in-progress on new push
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FOUNDRY_PROFILE: ci
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"
  RUST_BACKTRACE: full
  CI_ETH_WS_URL: ${{ secrets.CI_ETH_WS_URL }}

jobs:
  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check-Out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nightly
        run: |
          rustup toolchain install nightly-2026-04-23
          rustup component add --toolchain nightly-2026-04-23 rustfmt

      - name: Run formatting
        run: cargo +nightly-2026-04-23 fmt --all -- --check

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check-Out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
          cache: true

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-clippy-${{ runner.os }}
          cache-on-failure: true
          save-if: true

      - name: Run Clippy
        run: cargo clippy --workspace --all-features --profile ci

  cargo-test-unit:
    name: cargo test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check-Out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
          cache: true

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-test-unit-${{ runner.os }}
          cache-on-failure: true
          save-if: true

      - uses: taiki-e/install-action@nextest

      - name: Run unit tests
        run: cargo nextest run --workspace --exclude testnet --retries 3 --no-tests=warn --cargo-profile ci

  cargo-test-integration:
    name: cargo test (integration)
    runs-on: ubuntu-latest
    # The testnet tests are serialized (see .config/nextest.toml), so a run with
    # one genuine failure plus its retry needs more than 25 minutes to report as
    # a failure rather than be cancelled.
    timeout-minutes: 45
    steps:
      - name: Check-Out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
          cache: true

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-test-integration-${{ runner.os }}
          cache-on-failure: true
          save-if: true

      - uses: taiki-e/install-action@nextest

      - name: Run integration tests
        run: cargo nextest run --package testnet --retries 1 --no-tests=warn --cargo-profile ci

  cargo-test-anvil:
    name: cargo test (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check-Out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
          cache: true

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-test-anvil-${{ runner.os }}
          cache-on-failure: true
          save-if: true

      - uses: taiki-e/install-action@nextest

      - name: Run anvil settlement test
        run: cargo nextest run -p angstrom-types --features anvil --test anvil_settlement --retries 1 --cargo-profile ci

  contracts:
    name: forge fmt && forge test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 0.4.18

      - name: Setup python virtual environment
        working-directory: ./contracts
        run: uv venv .venv --python 3.12

      - name: Sync python dependencies
        working-directory: ./contracts
        run: uv pip install -r requirements.txt

      - name: Show Forge version
        working-directory: ./contracts
        run: forge --version

      - uses: rui314/setup-mold@v1

      - name: Utilize Shared Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "rust-cache-v1"
          save-if: true
          workspaces: "./contracts -> target"

      - name: Run Forge fmt
        working-directory: ./contracts
        run: forge fmt --check
        id: fmt

      - name: Run Forge tests
        working-directory: ./contracts
        run: forge test -vvv --ffi
        id: test
